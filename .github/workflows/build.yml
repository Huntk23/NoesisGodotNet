name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-latest
          - name: macOS Apple Silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Godot.NET.Sdk and the pure unit tests use NuGet-provided assemblies;
      # the engine itself is not required for this job.
      - name: Build
        run: dotnet build NoesisGodot.sln -c Debug

      - name: Test
        run: dotnet test tests/NoesisGodot.Tests/NoesisGodot.Tests.csproj -c Debug --no-build

  net8-compat:
    name: Compile addon for net8.0 projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The addon ships as source and compiles under the consuming project's
      # target framework. Godot 4.7 projects may still target net8.0, so make
      # sure the addon does not depend on net10.0-only APIs. Restore runs as its
      # own step because the implicit restore in `dotnet build` ignores
      # -p:TargetFramework and would only restore net10.0.
      - name: Build for net8.0
        run: |
          dotnet restore NoesisGodot.csproj -p:TargetFramework=net8.0
          dotnet build NoesisGodot.csproj -c Debug --no-restore -p:TargetFramework=net8.0

  package:
    name: Verify release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package addon
        shell: pwsh
        run: ./scripts/New-AddonPackage.ps1 -OutputPath dist/noesisgui-addon-ci.zip

      - name: Verify addon package
        shell: pwsh
        run: ./scripts/Test-AddonPackage.ps1 -ArchivePath dist/noesisgui-addon-ci.zip
