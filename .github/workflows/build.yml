name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Godot.NET.Sdk and the pure unit tests use NuGet-provided assemblies;
      # the engine itself is not required for this job.
      - name: Build
        run: dotnet build NoesisGodot.sln -c Debug

      - name: Test
        run: dotnet test tests/NoesisGodot.Tests/NoesisGodot.Tests.csproj -c Debug --no-build
