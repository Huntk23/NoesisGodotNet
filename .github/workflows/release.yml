name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/Prepare-ReleaseNotes.ps1 -ReleaseTag $env:RELEASE_TAG -OutputPath dist/release-notes.md

      - name: Package addon
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/New-AddonPackage.ps1 -OutputPath "dist/noesisgui-addon-$env:RELEASE_TAG.zip"

      - name: Verify addon package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/Test-AddonPackage.ps1 -ArchivePath "dist/noesisgui-addon-$env:RELEASE_TAG.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/noesisgui-addon-*.zip
          fail_on_unmatched_files: true
          body_path: dist/release-notes.md
