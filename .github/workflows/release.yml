name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/Prepare-ReleaseNotes.ps1 -ReleaseTag $env:RELEASE_TAG -OutputPath dist/release-notes.md

      - name: Package addon
        run: |
          cd addons
          zip -r "../dist/noesisgui-addon-${GITHUB_REF_NAME}.zip" noesisgui
          cd ..
          cp README.md CHANGELOG.md LICENSE dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/noesisgui-addon-*.zip
          fail_on_unmatched_files: true
          body_path: dist/release-notes.md
